name: Quality

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      CI: "true"
      JWT_SECRET: ci_test_super_secret_jwt_access_key_32char
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      MONGODB_URI: mongodb://127.0.0.1:27017/workforce_analytics_ci
      VITE_COMPANY_NAME: Stackly

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start In-Memory MongoDB Service
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: '7.0'

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test -- --run --pool=threads --no-file-parallelism --maxWorkers=1

      - name: Seed Database
        run: npm run seed -- --reset

      - name: Production build
        run: npm run build

      - name: Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
