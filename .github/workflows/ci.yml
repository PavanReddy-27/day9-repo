name: Workforce Analytics Production CI/CD Pipeline

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Mandatory Quality Gates & Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NODE_ENV: test
      CI: "true"
      JWT_SECRET: ci_test_super_secret_jwt_access_key_32char
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      MONGODB_URI: mongodb://127.0.0.1:27017/workforce_analytics_ci
      VITE_COMPANY_NAME: Stackly

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Start In-Memory MongoDB Service
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: '7.0'

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      # 1. Mandatory Linting
      - name: Run ESLint (Static Analysis)
        run: npm run lint

      # 2. Mandatory TypeScript Typechecking
      - name: Run TypeScript Typecheck (Frontend & Server)
        run: npm run typecheck

      # 3. Mandatory Vitest Unit & Integration Suites
      - name: Run Vitest Suites
        run: npm test -- --run

      # Seed Database for E2E Tests
      - name: Seed Database
        run: npm run seed -- --reset

      # 4. Mandatory Playwright End-to-End Tests
      - name: Run Playwright E2E Tests
        run: npm run test:e2e

      # 5. Mandatory Production Build Verification
      - name: Run Vite & TS Production Build
        run: npm run build

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

