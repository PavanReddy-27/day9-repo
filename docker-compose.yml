version: '3.8'

services:
  # ----------------------------------------------------
  # 1. MongoDB Database Service
  # ----------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: workforce-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: workforce_analytics
    volumes:
      - mongo-data:/data/db
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - workforce-network

  # ----------------------------------------------------
  # 2. Node.js Express Backend Service
  # ----------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: workforce-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/workforce_analytics
      JWT_SECRET: ${JWT_SECRET:-production-super-secret-jwt-key-32chars}
      CLIENT_URL: http://localhost:80
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - workforce-network

  # ----------------------------------------------------
  # 3. React Vite + Nginx Frontend Service
  # ----------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: workforce-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - workforce-network

networks:
  workforce-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local

